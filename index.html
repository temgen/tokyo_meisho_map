<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>東京 名所マップ</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#eef4f7;color:#24313a}
body{font-family:"UD デジタル 教科書体 N-R","BIZ UDPGothic","Yu Gothic",Meiryo,sans-serif;touch-action:manipulation}
button{font:inherit}
#app{height:100%;display:flex;min-height:0}
.main{width:100%;height:100%;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 186px;gap:6px;padding:6px}
.mapArea{position:relative;min-width:0;min-height:0;border-radius:12px;background:#fff;overflow:hidden}
.overviewWrap{position:absolute;left:50%;top:0;transform:translateX(-50%);z-index:40;display:flex;flex-direction:column;align-items:center;gap:2px}
.fullBtn{width:116px;height:44px;padding:2px;position:relative;overflow:hidden;border:2px solid #bccdd5;border-radius:14px;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 7px rgba(0,0,0,.05)}
.fullBtn img{width:100%;height:100%;object-fit:contain;display:block;background:#f3f7f8;border-radius:10px}
#overviewFocus{position:absolute;pointer-events:none;border:2px solid #e58b0b;border-radius:8px;background:rgba(255,181,40,.08);left:1.5%;top:1.5%;width:97%;height:97%;transition:left .25s, top .25s, width .25s, height .25s}
.navTri{position:absolute;z-index:41;width:44px;height:44px;border:2px solid #bccdd5;border-radius:14px;background:rgba(255,255,255,.94);display:none;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.navTri svg{width:25px;height:25px;display:block}
.navTri polygon{fill:#e58b0b}
.navTri:active{transform:scale(.97)}
.blink{animation:blinkTri 1s linear infinite}
@keyframes blinkTri{0%,46%{opacity:1}50%,96%{opacity:.18}100%{opacity:1}}
#navLeft{left:1.8%;top:57%}
#navUpWards{left:2.2%;top:10.5%}
#navRight{left:92%;top:58%}
#navUpWest{left:61%;top:10.5%}
#navDownAll{position:static;width:40px;height:40px;margin-top:1px}
.mapArea[data-view="wards"] #navLeft,
.mapArea[data-view="wards"] #navUpWards{display:flex}
.mapArea[data-view="west"] #navRight,
.mapArea[data-view="west"] #navUpWest{display:flex}
.mapArea[data-view="all"] #navDownAll{display:flex}
.heatMap{position:absolute;right:8px;top:4px;z-index:34;display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.94);border:2px solid #c8d5db;border-radius:999px;padding:6px 10px;box-shadow:0 2px 7px rgba(0,0,0,.08);font-size:11px;font-weight:1000;color:#52666f;pointer-events:none;white-space:nowrap}
.heatbar{display:flex;gap:2px}
.heatbar i{width:18px;height:10px;border-radius:4px;display:block}
.c0{background:#ffffff;border:1px solid #cfd8dc}
.c1{background:#fff7c2} .c2{background:#ffe5a3} .c3{background:#ffb45e}
.c4{background:#f07a2d} .c5{background:#e53935} .c6{background:#1976d2}
.mapStatus{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:36;background:rgba(255,255,255,.95);border:2px solid #d3dde2;border-radius:999px;padding:7px 14px;font-size:14px;font-weight:1000;pointer-events:none;opacity:0;transition:opacity .15s;white-space:nowrap}
.mapStatus.show{opacity:1}
.mapCanvas{position:absolute;inset:0;overflow:hidden;background:#f7fafb}
#mapSvg{display:block;width:100%;height:100%;touch-action:none}
.muni{fill:#f8faf9;stroke:#83949c;stroke-width:2.2;vector-effect:non-scaling-stroke;stroke-linejoin:round;cursor:pointer;transition:fill .15s,stroke .15s}
.muni:hover{fill:#f1f7fa}
.muni.wrong{fill:#dcebff;stroke:#2d70bd;stroke-width:5}
.muni.correct{fill:#ffe0a2;stroke:#ec8d12;stroke-width:6}
.muni.done{fill:#c8ecd0;stroke:#4d8c62}
.label{pointer-events:none;text-anchor:middle;dominant-baseline:middle;font-size:18px;font-weight:1000;fill:#31444d;paint-order:stroke;stroke:#fff;stroke-width:5;stroke-linejoin:round}
.label.hidden{display:none}
.pin{pointer-events:none}
.pin image{filter:drop-shadow(0 2px 4px rgba(0,0,0,.28))}
.pin text{font-size:20px;font-weight:1000;fill:#d82626;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:5;stroke-linejoin:round}
.mapTools{position:absolute;left:12px;bottom:12px;z-index:25;display:flex;gap:6px}
.toolBtn{min-height:42px;border:2px solid #b8cbd5;border-radius:12px;background:rgba(255,255,255,.96);font-size:13px;font-weight:1000;padding:5px 10px}
.toolBtn.on{background:#e7f5fb;border-color:#2f84aa;color:#246780}
.cardsCol{min-width:0;min-height:0;background:#ffffff;border-radius:12px;padding:6px 6px 8px;display:flex;flex-direction:column;gap:6px;overflow:visible;position:relative}
.cardsHead{text-align:center;font-size:18px;font-weight:1000;line-height:1.1;padding:4px 0 2px}
.cardsHead small{display:block;font-size:11px;color:#6b7e87;margin-top:3px}
.cardPrompt{flex:0 0 auto;text-align:center;font-size:14px;font-weight:1000;color:#315769;background:#eef6fa;border:2px solid #c8dbe4;border-radius:11px;padding:6px 5px;margin:0 0 5px}
#cards{flex:1;min-height:0;display:grid;grid-template-columns:1fr;grid-auto-rows:minmax(0,1fr);gap:6px;overflow:visible}
.card{min-width:0;min-height:0;border:3px solid #c4d3da;border-radius:13px;background:#fff;overflow:visible;display:flex;align-items:center;gap:8px;cursor:grab;touch-action:none;user-select:none;padding:5px 6px;transition:transform .08s, box-shadow .08s;transform-origin:center center;position:relative}
.card.touching{transform:scale(1.35);z-index:80;box-shadow:0 16px 30px rgba(0,0,0,.30)}
.card.selected{border-color:#ee9719;box-shadow:0 0 0 3px #ffd98c}
.card.done{opacity:.26;filter:grayscale(.75);pointer-events:none}
.card img{width:66px;height:52px;object-fit:cover;background:#f0f4f6;border-radius:8px;flex:0 0 auto}
.card[data-id="skytree"] img{object-fit:contain}
.cardText{min-width:0;flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;line-height:1.04}
.cardText b{font-size:14px}
.cardText small{font-size:10px;color:#617680;margin-top:4px}
#guideSvg{position:fixed;inset:0;width:100%;height:100%;z-index:70;pointer-events:none;display:none}
#guideLine{stroke:#fff;stroke-width:8;stroke-linecap:round;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
#guideTip{fill:#fff;stroke:#3f4d54;stroke-width:3}
.flash{position:fixed;inset:0;z-index:12000;pointer-events:none;display:flex;align-items:center;justify-content:center;font-size:min(31vw,210px);font-weight:1000;opacity:0}
.flash.ok{color:#e73131;text-shadow:0 4px #fff;animation:flash .48s}
.flash.ng{color:#2770c5;text-shadow:0 4px #fff;animation:flash .48s}
@keyframes flash{0%{opacity:0;transform:scale(.5)}25%{opacity:1;transform:scale(1.05)}75%{opacity:1}100%{opacity:0;transform:scale(1.18)}}
.modal,.clear{position:fixed;inset:0;z-index:9000;background:rgba(25,48,62,.72);display:none;align-items:center;justify-content:center;padding:18px}
.modal.show,.clear.show{display:flex}
.modalCard{width:min(760px,94vw);background:#fff;border:5px solid #f0b632;border-radius:26px;padding:18px;display:grid;grid-template-columns:40% 1fr;gap:17px;box-shadow:0 18px 50px #0005}
.modalCard img{width:100%;height:300px;object-fit:cover;border-radius:17px;background:#f1f4f6}
.modalCard img.skytree{object-fit:contain}
.info{display:flex;flex-direction:column;justify-content:center;text-align:center;min-width:0}
.info h2{font-size:33px;margin:0;color:#236e91}
.info h2 small{display:block;font-size:14px;color:#647983;margin-top:4px}
.muniAnswer{margin:13px auto 6px;background:#e7f7ec;border:3px solid #70a980;border-radius:17px;padding:10px 18px;font-size:25px;font-weight:1000}
.muniAnswer small{display:block;font-size:13px;color:#537361;margin-top:3px}
.gameBadge{margin:7px auto 13px;background:#fff2bf;border:3px solid #d9ae34;border-radius:15px;padding:9px 13px;font-size:18px;font-weight:1000}
.backBtn{align-self:center;min-height:50px;border:0;border-radius:15px;background:#2f84aa;color:#fff;padding:10px 25px;font-size:18px;font-weight:1000}
.clearCard{width:min(620px,92vw);background:#fff;border:6px solid #ffd04c;border-radius:28px;padding:28px;text-align:center}
.clearCard h2{font-size:44px;margin:0;color:#e2532e}
.clearCard p{font-size:20px;font-weight:900}
.clearCard button{min-height:52px;border:0;border-radius:15px;background:#2f84aa;color:#fff;padding:10px 22px;font-size:18px;font-weight:1000}

/* 追加：高さくらべ */
.sortGuide.heightGuide{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;font-size:18px}
.heightArrow{font-size:28px;color:#e58b0b;line-height:1}
.heightStep{display:flex;align-items:center;gap:5px;background:#fff7d2;border:2px solid #efc75a;border-radius:999px;padding:5px 10px;font-size:16px}
.heightTri{display:inline-flex;align-items:flex-end;gap:2px;height:18px}
.heightTri i{display:block;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:12px solid #f0902f}.heightTri.mid i:nth-child(2){transform:translateY(-4px)}.heightTri.high i:nth-child(2){transform:translateY(-3px)}.heightTri.high i:nth-child(3){transform:translateY(-7px)}
.heightToken{flex-direction:column;gap:4px;height:114px;padding:6px 8px}
.heightShape{position:relative;display:flex;align-items:flex-end;justify-content:center;width:52px;height:64px}
.heightShape.school::before{content:"";width:46px;height:34px;background:#f5d38b;border:3px solid #8a6a2c;border-radius:7px 7px 4px 4px;box-shadow:inset 0 -7px 0 #dfb765}
.heightShape.school::after{content:"";position:absolute;bottom:9px;left:50%;transform:translateX(-50%);width:12px;height:17px;background:#7aa8d8;border-radius:3px 3px 0 0}
.heightShape.tokyotower::before{content:"";width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-bottom:58px solid #e15d2f}
.heightShape.tokyotower::after{content:"";position:absolute;bottom:0;width:7px;height:48px;background:#ffd8c8;border-radius:4px}
.heightShape.skytree::before{content:"";width:12px;height:62px;background:linear-gradient(#b9c9d5,#7d9bb0);border-radius:8px 8px 3px 3px}
.heightShape.skytree::after{content:"";position:absolute;bottom:53px;width:2px;height:18px;background:#7d9bb0;box-shadow:0 4px 0 1px #a6b8c4, 0 14px 0 0 #7d9bb0}
.heightResult{display:flex;flex:1;align-items:flex-end;justify-content:center;gap:28px;background:#eef8ff;border-radius:18px;padding:10px 10px 20px;position:relative;overflow:hidden}
.heightResult::before{content:"";position:absolute;left:0;right:0;bottom:17px;height:6px;background:#8fb268}
.growCol{width:28%;max-width:180px;min-width:96px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px;position:relative;z-index:1}
.growLabel{font-weight:1000;color:#445b67;text-align:center;font-size:15px;line-height:1.2}
.growWrap{height:220px;width:100%;display:flex;align-items:flex-end;justify-content:center}
.growShape{position:relative;transform-origin:bottom center}
.growShape.school{width:72px;height:72px}.growShape.school::before{content:"";position:absolute;left:9px;right:9px;bottom:0;height:48px;background:#f5d38b;border:4px solid #8a6a2c;border-radius:8px 8px 5px 5px;box-shadow:inset 0 -12px 0 #dfb765}.growShape.school::after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:4px;width:16px;height:24px;background:#7aa8d8;border-radius:4px 4px 0 0}
.growShape.tokyotower{width:78px;height:70px}.growShape.tokyotower::before{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:0;height:0;border-left:28px solid transparent;border-right:28px solid transparent;border-bottom:70px solid #e15d2f}.growShape.tokyotower::after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:10px;height:62px;background:#ffd8c8;border-radius:5px}
.growShape.skytree{width:70px;height:70px}.growShape.skytree::before{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:18px;height:70px;background:linear-gradient(#cad6df,#7d9bb0);border-radius:11px 11px 4px 4px}.growShape.skytree::after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:58px;width:4px;height:26px;background:#7d9bb0;box-shadow:0 12px 0 2px #a6b8c4,0 24px 0 0 #7d9bb0}
.growShape.stretchTower{animation:stretchTower 1s ease forwards}.growShape.stretchSky{animation:stretchSky 1.1s ease forwards}
@keyframes stretchTower{0%{transform:scaleY(1)}100%{transform:scaleY(1.65)}}
@keyframes stretchSky{0%{transform:scaleY(1)}100%{transform:scaleY(2.35)}}

.heightObjImg{display:block;object-fit:contain;max-width:100%;max-height:84px}.heightObjImg.schoolImg{width:98px;height:66px}.heightObjImg.towerImg{width:48px;height:84px}.heightSkyImg{max-width:54px;max-height:84px;object-fit:contain}
.growSchoolPhoto{display:block;width:145px;height:88px;object-fit:contain;transform-origin:bottom center}
.growTowerPhoto{display:block;height:82px;width:auto;object-fit:contain;transform-origin:bottom center}
.growTowerPhoto.stretchTower{animation:stretchTowerPhoto 1.8s ease forwards}
@keyframes stretchTowerPhoto{0%{height:82px}100%{height:150px}}
.growSkyPhoto{height:94px;width:auto;display:block;transform-origin:bottom center}
.growSkyPhoto.stretchSky{animation:stretchSkyImg 1.05s ease forwards}
@keyframes stretchSkyImg{0%{height:94px}100%{height:188px}}

.heightRevealMsg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:25;background:#fff;border:5px solid #e99a20;border-radius:22px;padding:16px 24px;text-align:center;box-shadow:0 10px 30px #0004;font-weight:1000;min-width:min(430px,76vw)}
.heightRevealMsg strong{display:block;font-size:32px;color:#d43b28;margin-bottom:7px}.heightRevealMsg span{display:block;font-size:22px;color:#315769}.heightRevealMsg b{font-size:34px;color:#e13c2b}
.heightResult .growCol{transition:order .1s}

/* 追加：パラパラ */
.flipbookPreview{position:absolute;inset:10% 8%;z-index:20;display:flex;align-items:center;justify-content:center}
.peelStack{position:relative;width:min(460px,72vw);height:min(300px,48vh);perspective:1100px;overflow:visible}
.peelBase,.peelSheet{position:absolute;inset:0;border-radius:20px;background:#fff;border:4px solid #e59d28;box-shadow:0 9px 24px #0003;overflow:hidden;backface-visibility:visible}
.peelBase{z-index:1}
.peelSheet{z-index:2;transform-origin:left top;will-change:transform}
.peelBase::after,.peelSheet::after{content:"";position:absolute;right:0;top:0;width:20%;height:100%;background:linear-gradient(90deg,#ffffff00,#e8e8e86b)}
.peelSheet.run{animation:peelOff .22s cubic-bezier(.18,.68,.32,1) forwards}
@keyframes peelOff{
  0%{transform:translate(0,0) rotateY(0deg) rotateZ(0deg)}
  45%{transform:translate(-38px,24px) rotateY(58deg) rotateZ(-5deg)}
  100%{transform:translate(-150px,105px) rotateY(112deg) rotateZ(-14deg)}
}
.peelFrame{position:absolute;inset:12% 11%;border:3px solid #b9cbd3;border-radius:16px;background:linear-gradient(#eaf7ff,#fff);overflow:hidden}
.peelFrame .frameBall{width:42px;height:42px}
.peelHint{position:absolute;left:50%;bottom:5%;transform:translateX(-50%);background:#fff8d8;border:2px solid #efc75a;border-radius:999px;padding:6px 12px;font-size:16px;font-weight:1000;color:#6d5522;white-space:nowrap}

/* 渋谷：JS制御版 */
.shibuyaStage{height:100%;position:relative;background:#575757;overflow:hidden}
.crossRoad{position:absolute;inset:0;background:linear-gradient(90deg,#444 0 11%,#585858 11% 89%,#444 89%)}
.crossRoad::before{content:"";position:absolute;left:13%;right:13%;top:18%;bottom:18%;background:repeating-linear-gradient(90deg,#fff 0 5.5%,transparent 5.5% 9%);opacity:.95}
.signalBox{position:absolute;left:16px;top:16px;z-index:10;width:92px;background:#1d1d1d;border-radius:16px;padding:10px 8px;color:#fff;text-align:center;box-shadow:0 4px 12px #0004}
.signalStack{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:6px}
.signalLight{width:44px;height:44px;border-radius:50%;background:#3d3d3d;box-shadow:inset 0 0 0 3px #1a1a1a}
.signalLight.red.on{background:#e53333;box-shadow:0 0 16px #e53333}
.signalLight.blue.on{background:#2a7be2;box-shadow:0 0 16px #2a7be2}
.signalLight.blinkOff{background:#4a5871;box-shadow:none}
.signalText{font-size:14px;font-weight:1000;line-height:1.2}
.crowd{position:absolute;inset:0;z-index:4}
.person{position:absolute;font-size:24px;line-height:1;filter:drop-shadow(0 1px 1px #0006);user-select:none;pointer-events:none;will-change:transform,left,top}
.stopHold{position:absolute;right:18px;bottom:18px;z-index:10;width:165px;height:74px;border:0;border-radius:18px;background:#d93636;color:#fff;font-size:24px;font-weight:1000;box-shadow:0 6px 0 #9f2222;touch-action:none}
.stopHold.holding{transform:translateY(5px);box-shadow:0 1px 0 #9f2222;background:#8f2525}
.shibuyaGuide{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:10;background:#fff;border-radius:999px;padding:7px 14px;font-size:17px;font-weight:1000;white-space:nowrap}
.gameGauge{position:absolute;left:18px;right:198px;bottom:20px;z-index:10;height:30px;border:3px solid #fff;border-radius:999px;background:#26353d;overflow:hidden}.gameGauge>span{display:block;height:100%;width:0;background:#ffd43d;transition:width .08s}

/* 東京駅：ピタ止め */
.stationStage{height:100%;position:relative;background:linear-gradient(#eaf3f8 0 62%,#ccdbe2 62% 100%);overflow:hidden}
.stationRoof{position:absolute;left:8%;right:8%;top:13%;height:18%;background:linear-gradient(#b9472f,#a13b26);border-radius:16px 16px 0 0}
.stationFront{position:absolute;left:8%;right:8%;top:24%;height:24%;background:repeating-linear-gradient(90deg,#b84e35 0 7%,#d8785d 7% 9.5%,#b84e35 9.5% 17%);border:4px solid #8d3626;border-top:none;border-radius:0 0 12px 12px}
.platformLine{position:absolute;left:0;right:0;bottom:22%;height:16%;background:#f1e8cb;border-top:5px solid #c9b487;border-bottom:5px solid #b39d6f}
.trackOne,.trackTwo{position:absolute;left:0;right:0;height:5px;background:#666}.trackOne{bottom:14%}.trackTwo{bottom:7%}
.stopZone{position:absolute;left:69%;transform:translateX(-50%);bottom:9%;width:230px;height:92px;background:#fff5b7cc;border:5px dashed #e8a91b;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:1000;color:#9a6408;z-index:3;text-align:center;transition:border-color .12s,background .12s,box-shadow .12s}.stopZone.ready{border-color:#2d9b50;background:#dff7e6e8;box-shadow:0 0 0 5px #45b96555;color:#23733b}
.trainMover{position:absolute;left:-12%;bottom:10.5%;z-index:5;width:170px;height:72px;border:4px solid #587886;border-radius:16px;background:#fff;display:flex;align-items:center;justify-content:center;gap:8px;padding:6px;box-shadow:0 6px 12px #0002}
.trainBodyEmoji{font-size:40px;line-height:1}.trainLabel{font-size:16px;font-weight:1000;line-height:1.2;text-align:center}
.stationScore{position:absolute;left:14px;top:12px;background:#fff;border-radius:12px;padding:7px 12px;font-size:18px;font-weight:1000;z-index:7}
.stationGuide{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:7;background:#fff;border-radius:999px;padding:7px 14px;font-size:17px;font-weight:1000;white-space:nowrap}
.stationAction{position:absolute;right:18px;bottom:18px;z-index:8;width:148px;height:72px;border:0;border-radius:18px;background:#2f84aa;color:#fff;font-size:24px;font-weight:1000;box-shadow:0 6px 0 #1f5e78}.stationAction:active{transform:translateY(5px);box-shadow:0 1px 0 #1f5e78}
.trainMover.shinkansen{border-color:#3c6fb4}.trainMover.jr{border-color:#3e9450}.trainMover.subway{border-color:#9061bf}


.stationRule{position:absolute;left:50%;top:54px;transform:translateX(-50%);z-index:8;background:#ffffffee;border:3px solid #8aa8b6;border-radius:14px;padding:7px 13px;font-size:14px;font-weight:1000;text-align:center;line-height:1.35;white-space:nowrap}

/* 高尾山：背景を動かす */
.takaoStage{height:100%;position:relative;overflow:hidden;background:#dce8d4}
.takaoBg{position:absolute;left:-29%;top:-25%;width:158%;height:195%;background:url('images/takao.png') center top/cover no-repeat;transform:translateY(-32%) scale(1.50);transition:transform .82s ease;filter:saturate(1.02)}
.takaoStage::after{content:"";position:absolute;inset:0;background:linear-gradient(#ffffff15,#ffffff20);pointer-events:none}
.takaoPrompt{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:9;background:#fff;border:3px solid #5f966b;border-radius:999px;padding:8px 17px;font-size:20px;font-weight:1000;white-space:nowrap}
.hiker{position:absolute;left:11%;bottom:7%;z-index:9;font-size:58px;transition:bottom .82s ease,left .82s ease;filter:drop-shadow(0 2px 2px #fff)}

function enableSlotDrag(bank,slots,selector,afterDrop){
  let ghost=null;
  const handlers=[];
  function bind(item){
    const down=e=>{
      e.preventDefault();item.setPointerCapture?.(e.pointerId);
      const r=item.getBoundingClientRect();ghost=item.cloneNode(true);ghost.classList.add('miniDragGhost');ghost.style.width=r.width+'px';ghost.style.height=r.height+'px';document.body.appendChild(ghost);
      const move=ev=>{if(!ghost)return;ghost.style.left=ev.clientX+'px';ghost.style.top=ev.clientY+'px'};
      const up=ev=>{
        item.removeEventListener('pointermove',move);if(ghost){ghost.remove();ghost=null}
        const slot=document.elementsFromPoint(ev.clientX,ev.clientY).find(x=>x.classList&&x.classList.contains('dropSlot'));
        if(slot){const old=slot.querySelector(selector);if(old&&old!==item)bank.appendChild(old);slot.appendChild(item)}
        afterDrop();
      };
      move(e);item.addEventListener('pointermove',move);item.addEventListener('pointerup',up,{once:true});item.addEventListener('pointercancel',up,{once:true});
    };
    item.addEventListener('pointerdown',down);handlers.push(()=>item.removeEventListener('pointerdown',down));
  }
  bank.querySelectorAll(selector).forEach(bind);
  registerCleanup(()=>{handlers.forEach(fn=>fn());if(ghost)ghost.remove()});
}

function startStation(){
  gameStage.innerHTML=`<div class="stationStage v28Station"><img class="stationGameBg" src="images/station_game.png" alt="東京駅"><div class="stationGameShade"></div><div class="stationRule">でんしゃを ホームで とめよう！</div><div id="stationScore" class="stationScore">せいかい 0 / 5</div><div class="platformLine"></div><div class="trackOne"></div><div class="trackTwo"></div><div id="stopZone" class="stopZone">ここ</div><img id="trainMover" class="stationTrainImg" alt="でんしゃ"><button id="stationStop" class="stationAction" type="button">とめる</button></div>`;

  const trains=[
    {type:'shinkansen',src:'images/train_shinkansen.png',label:'しんかんせん',scale:2.05},
    {type:'jr',src:'images/train_jr.png',label:'JRでんしゃ',scale:2.25},
    {type:'subway',src:'images/train_subway.png',label:'ちかてつ',scale:2.25}
  ];
  const SUBWAY_SPEED=165;
  const JR_SPEED=235;

    {left:10,bottom:7,bg:-44},
    {left:18,bottom:22,bg:-35},
    {left:27,bottom:37,bg:-26},
    {left:37,bottom:52,bg:-17},
    {left:48,bottom:68,bg:-8}
  ];
  function moveScene(idx){
    const p=poses[idx];
    hiker.style.left=p.left+'%';
    hiker.style.bottom=p.bottom+'%';
    bg.style.setProperty('--takaoY',p.bg+'%');
    prompt.textContent=idx<4?`しぜんに あるものを あと ${4-idx}つ！`:'4つ みつけた！';
  }
  function click(e){
    const el=e.currentTarget;
    if(el.dataset.natural==='1'){
      if(el.classList.contains('found'))return;
      el.classList.add('found');
      step++;
      moveScene(step);
      if(step>=4)setTimeout(()=>gameClear('しぜんに あるものを 4つ みつけて のぼれた！'),1150);
    }else miniToast('これは しぜんの ものかな？',600)
  }
  buttons.forEach(b=>b.addEventListener('click',click));
  moveScene(0);
  registerCleanup(()=>buttons.forEach(b=>b.removeEventListener('click',click)));
}
function startOkutama(){
  gameStage.innerHTML=`<div class="okutamaStage"><div id="okutamaBg" class="okutamaBgReveal"></div><div class="okutamaPrompt">💧 みずを タップして みずうみに いれよう！</div><div class="lakeGauge"><span id="lakeGaugeFill"></span></div><div id="lakeWindow" class="lakeWindow"><div class="lakeWindowTitle">おくたまの みずうみ</div><div class="lakeBasin"><div id="lakeWater" class="lakeWater"></div></div></div></div>`;
  const stage=gameStage.querySelector('.okutamaStage'),bg=document.getElementById('okutamaBg'),water=document.getElementById('lakeWater'),gauge=document.getElementById('lakeGaugeFill'),lakeWindow=document.getElementById('lakeWindow');let level=8,spawnTimer=0,alive=true;
  function update(){water.style.height=level+'%';gauge.style.height=level+'%';bg.style.opacity=String(Math.max(0,Math.min(1,(level-8)/92)));if(level>=100){alive=false;clearInterval(spawnTimer);setTimeout(()=>gameClear('みずうみに みずが いっぱい たまった！'),500)}}
  function sendToLake(srcEl){const sr=srcEl.getBoundingClientRect(),tr=lakeWindow.getBoundingClientRect(),st=stage.getBoundingClientRect();const drop=document.createElement('div');drop.className='flyDrop';drop.textContent='💧';drop.style.left=(sr.left-st.left+sr.width/2)+'px';drop.style.top=(sr.top-st.top+sr.height/2)+'px';drop.style.transform='translate(-50%,-50%) scale(1)';stage.appendChild(drop);requestAnimationFrame(()=>{drop.style.left=(tr.left-st.left+tr.width/2)+'px';drop.style.top=(tr.top-st.top+tr.height*.63)+'px';drop.style.transform='translate(-50%,-50%) scale(.55)';drop.style.opacity='.65'});setTimeout(()=>{drop.remove();level=Math.min(100,level+10);update();miniToast('+ みず！',350)},440)}
  function spawn(){if(!alive)return;const isWater=Math.random()<.65;const el=document.createElement('div');el.className='fallItem';el.textContent=isWater?'💧':(Math.random()<.5?'🥫':'📄');el.dataset.water=isWater?'1':'0';el.style.left=(12+Math.random()*76)+'%';el.style.animationDuration=(3+Math.random()*1.4)+'s';const tap=e=>{e.preventDefault();if(el.dataset.water==='1')sendToLake(el);else{level=Math.max(8,level-6);update();miniToast('ゴミは いれないよ',450)}el.remove()};el.addEventListener('pointerdown',tap);el.addEventListener('animationend',()=>el.remove(),{once:true});stage.appendChild(el)}
  spawnTimer=setInterval(spawn,680);for(let i=0;i<4;i++)setTimeout(spawn,i*170);update();registerCleanup(()=>{alive=false;clearInterval(spawnTimer);stage.querySelectorAll('.fallItem,.flyDrop').forEach(el=>el.remove())});
}
miniStartBtn.addEventListener('click',()=>{if(currentGamePlace)startGame(currentGamePlace)});
document.getElementById('backBtn').addEventListener('click',()=>{
  stopActiveGame();modal.classList.remove('show');
  if(finalPending){setTimeout(startFinalSchoolChallenge,220)}
});

document.getElementById('navLeft').addEventListener('click',()=>setView('west'));
document.getElementById('navUpWards').addEventListener('click',()=>setView('all'));
document.getElementById('navRight').addEventListener('click',()=>setView('wards'));
document.getElementById('navUpWest').addEventListener('click',()=>setView('all'));

function startFromTitle(){
  if(titleScreen.classList.contains('hide'))return;
  titleScreen.classList.add('hide');
  currentView='wards';updateView(false);
}
titleScreen.addEventListener('pointerup',startFromTitle);
titleScreen.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();startFromTitle()}});
renderMap();renderCards();
currentView='wards';updateView(false);
</script>
